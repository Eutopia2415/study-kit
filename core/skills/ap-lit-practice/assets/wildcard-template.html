<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <title>@@TITLE@@</title>
  <style>
    :root {
      --page-bg: #f8f7f2;
      --page-text: #24342d;
      --surface: #ffffff;
      --soft: #e8ebe7;
      --hover: #eff1ee;
      --border: #cbd2cc;
      --muted: #637168;
      --accent: #24342d;
      --accent-text: #f8f7f2;
      --success: #226447;
      --error: #9e3636;
      --wrong-tint: #f9eded;
      --wrong-choice-bg: #f6dddd;
      --wrong-border: #a82929;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--page-text);
      font: 17px/1.45 Georgia, "Times New Roman", serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible, input:focus-visible, textarea:focus-visible,
    summary:focus-visible, a:focus-visible {
      outline: 3px solid #c88730;
      outline-offset: 3px;
    }

    .shell { height: 100dvh; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 13px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .brand { margin: 0; font-size: 23px; line-height: 1.15; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .color-panel.attempt-panel { right: 116px; }
    .button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--page-text);
      font: 600 14px/1.3 system-ui, sans-serif;
    }
    .button:hover:not(:disabled) { background: var(--hover); }
    .button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .button.primary:hover:not(:disabled) { opacity: .84; background: var(--accent); }
    .button.subtle { border-color: transparent; background: transparent; }
    .button.subtle:hover { background: var(--hover); }

    .color-panel {
      position: absolute;
      z-index: 10;
      top: 64px;
      right: 25px;
      width: min(360px, calc(100vw - 30px));
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 16px 45px #0002;
      font: 14px/1.45 system-ui, sans-serif;
    }
    .color-panel h2 { margin: 0 0 5px; font: 700 18px/1.2 system-ui, sans-serif; }
    .color-panel p { margin: 0 0 14px; color: var(--muted); }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .preset {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--page-text);
      padding: 6px 10px;
      font: 13px system-ui, sans-serif;
    }
    .preset:hover, .preset[aria-pressed="true"] { background: var(--soft); }
    .swatch { width: 15px; height: 15px; border: 1px solid #7775; border-radius: 50%; }
    .color-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .color-controls label { display: grid; gap: 5px; font-weight: 600; }
    .color-controls input { width: 100%; height: 42px; padding: 3px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
    .contrast { margin-top: 12px; font-size: 13px; }
    .contrast.warning { color: var(--error); font-weight: 700; }
    .color-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }

    .mobile-tabs { display: none; }
    .layout { display: grid; grid-template-columns: minmax(0, 48%) minmax(0, 52%); flex: 1; min-height: 0; overflow: hidden; background: var(--page-bg); }
    .passage, .question-pane { min-height: 0; overflow: auto; }
    .passage { height: 100%; padding: 27px 32px; border-right: 1px solid var(--border); background: var(--surface); }
    .question-pane { align-self: start; max-height: calc(100% - 40px); margin: 20px; padding: 28px 32px 32px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: 0 3px 12px #0000000a; }
    .question-pane.is-wrong { background: var(--wrong-tint); }
    h2 { margin: 0; font-size: 27px; }
    .author { margin: 2px 0 20px; font-size: 18px; }
    .verse { font-size: 17px; line-height: 1.58; }
    .line { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 11px; }
    .line.stanza { margin-top: 22px; }
    .line-number { color: var(--muted); font: 12px/2.25 system-ui, sans-serif; text-align: right; user-select: none; }
    .line-text { white-space: pre-wrap; }
    .gloss { margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border); font-size: 15px; }
    .gloss summary { cursor: pointer; font-weight: 700; }
    .gloss p { margin: 9px 0 0; }
    .source { margin-top: 18px; color: var(--muted); font: 12px/1.5 system-ui, sans-serif; }
    .visual-stage { min-height: 280px; display: grid; place-items: center; padding: 28px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); }
    .visual-stage svg, .visual-stage img { display: block; max-width: 100%; max-height: min(65dvh, 560px); height: auto; border-radius: 6px; }
    .visual-stage .portrait { width: min(100%, 520px); }
    .visual-stage .flag-art { width: min(100%, 540px); }
    .visual-stage .map-art { width: min(100%, 540px); height: auto; }
    .equation { font-size: clamp(30px, 4vw, 50px); text-align: center; }
    .number-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .number-card { display: grid; place-items: center; width: 86px; height: 118px; border: 2px solid #d4be8e; border-radius: 9px; background: #fff9ec; color: #263630; box-shadow: 0 5px 0 #071d1b55; font: 700 48px Georgia, serif; }
    .visual-open { display: none; margin: -5px 0 18px; }
    a { color: var(--page-text); }

    .question-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
    .question-head h2 { font-size: 21px; }
    .flag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font: 14px system-ui, sans-serif; }
    .flag input { width: 19px; height: 19px; accent-color: var(--accent); }
    .stem { margin: 0 0 23px; font-size: 20px; line-height: 1.52; }
    .options { display: grid; gap: 10px; }
    .option-row { display: flex; align-items: stretch; gap: 8px; }
    .choice {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 13px;
      min-height: 59px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--page-text);
      text-align: left;
      font-size: 17px;
      line-height: 1.4;
    }
    .choice:hover:not(:disabled), .strike:hover:not(:disabled) { background: var(--hover); }
    .choice[aria-pressed="true"] { border: 2px solid var(--accent); padding: 10px 13px; background: var(--soft); }
    .choice.is-eliminated .choice-text { text-decoration: line-through; opacity: .55; }
    .letter {
      display: grid;
      place-items: center;
      flex: 0 0 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 50%;
      font-size: 16px;
    }
    .choice[aria-pressed="true"] .letter { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .choice.is-wrong-choice { border: 2px solid var(--wrong-border); padding: 10px 13px; background: var(--wrong-choice-bg); }
    .choice.is-wrong-choice .letter { background: var(--wrong-border); color: var(--page-bg); border-color: var(--wrong-border); }
    .strike {
      flex: 0 0 48px;
      min-width: 48px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--page-text);
      font: 22px/1 system-ui, sans-serif;
    }
    .strike[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); }
    .confidence { margin-top: 24px; }
    .confidence p { margin: 0 0 8px; font: 600 14px system-ui, sans-serif; }
    .segments { display: flex; flex-wrap: wrap; gap: 8px; }
    .segments button[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
    .utility { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 18px; color: var(--muted); font: 13px system-ui, sans-serif; }
    .utility span { margin-right: auto; }
    .text-button { border: 0; background: transparent; color: var(--page-text); text-decoration: underline; padding: 7px 0; cursor: pointer; }
    .feedback { margin-top: 24px; border-left: 3px solid var(--accent); padding-left: 16px; font-size: 16px; line-height: 1.55; }
    .feedback.is-wrong { border-left: 5px solid var(--wrong-border); }
    .feedback strong { display: block; margin-bottom: 6px; }
    .answer-explanation { margin: 0; }
    .other-choices { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
    .other-choices summary { cursor: pointer; font: 700 14px/1.4 system-ui, sans-serif; }
    .other-choices ul { margin: 10px 0 0; padding-left: 21px; }
    .other-choices li { margin: 0 0 9px; padding: 4px 6px; }
    .other-choices li.your-choice { background: var(--wrong-choice-bg); border-radius: 5px; }
    .other-choices .letter-label { font-weight: 700; }
    .other-choices .your-choice-note { color: var(--error); font: 700 12px system-ui, sans-serif; }
    .correct { color: var(--success); }
    .incorrect { color: var(--error); }

    .footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-left: 48%; padding: 11px 20px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); background: var(--surface); }
    .footer-middle { display: flex; align-items: center; gap: 12px; }
    #progress { color: var(--muted); white-space: nowrap; font: 13px system-ui, sans-serif; }
    .review-intro, .result-info { color: var(--muted); font-size: 16px; line-height: 1.5; }
    .review-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; margin: 23px 0; }
    .review-cell { min-height: 76px; padding: 9px; text-align: left; }
    .review-cell b { display: block; font-size: 20px; }
    .review-cell small { display: block; margin-top: 4px; color: var(--muted); font: 12px system-ui, sans-serif; }
    .review-cell.answered { background: var(--soft); }
    .review-cell.is-wrong { background: var(--wrong-tint); border-color: var(--wrong-border); box-shadow: inset 0 0 0 1px var(--wrong-border); }
    .review-cell.is-wrong small { color: var(--wrong-border); font-weight: 700; }
    .review-cell.flagged { border-top: 4px solid #ae7919; }
    .review-note { color: var(--muted); font: 13px/1.5 system-ui, sans-serif; }
    .notes-label { display: block; margin-top: 20px; font-size: 16px; }
    textarea { width: 100%; min-height: 90px; margin-top: 9px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--page-text); resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin: 20px 0; }
    .score { margin: 18px 0 8px; font-size: 46px; }
    .score span { color: var(--muted); font-size: 19px; }
    .status { min-height: 18px; color: var(--muted); font: 13px system-ui, sans-serif; }
    #result-summary { min-height: 250px; font: 12px/1.5 ui-monospace, monospace; }
    .wildcard-warning { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: #091816c9; }
    .wildcard-warning-card { width: min(540px, 100%); padding: clamp(24px, 5vw, 42px); border: 3px solid #c6a765; border-radius: 18px; background: #fffaf0; box-shadow: 0 28px 75px #0008; text-align: center; }
    .wildcard-warning-card h2 { font: 700 clamp(24px, 5vw, 34px)/1.2 Georgia, serif; color: #8f292d; }
    .wildcard-score-change { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 16px; margin: 25px 0; font: 700 clamp(37px, 8vw, 64px)/1 Georgia, serif; }
    .wildcard-original-score { position: relative; color: #276caa; }
    .wildcard-original-score::after { content: ""; position: absolute; left: -6%; top: 50%; width: 112%; height: 5px; border-radius: 8px; background: #bc2830; transform: rotate(-12deg); }
    .wildcard-score-arrow, .wildcard-final-score { color: #b72d34; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 45%) minmax(0, 55%); }
      .passage { padding: 22px 20px; }
      .question-pane { margin: 14px; max-height: calc(100% - 28px); padding: 24px 22px; }
      .choice { font-size: 16px; }
      .review-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .footer { margin-left: 45%; padding: 9px 14px; gap: 8px; }
      .footer .button { padding: 8px 10px; }
      #progress { display: none; }
    }
    @media (max-width: 900px) {
      .topbar { padding: 11px 16px; }
      .brand { font-size: 20px; }
      .top-actions .button { padding: 8px 10px; }
      .color-panel.attempt-panel { right: 15px; }
      .mobile-tabs { display: flex; border-bottom: 1px solid var(--border); }
      .mobile-tabs button { flex: 1; border: 0; border-radius: 0; background: var(--surface); color: var(--page-text); padding: 10px; min-height: 44px; }
      .mobile-tabs button[aria-selected="true"] { border-bottom: 3px solid var(--accent); }
      .layout { display: block; background: var(--surface); }
      .passage, .question-pane { height: 100%; max-height: none; }
      .passage { display: none; border-right: 0; }
      .show-poem .passage { display: block; }
      .show-poem .question-pane { display: none; }
      .question-pane { margin: 0; padding: 22px 18px; border: 0; border-radius: 0; box-shadow: none; }
      .stem { font-size: 19px; }
      .choice { min-height: 58px; font-size: 16px; }
      .visual-open { display: inline-block; }
      .footer { margin-left: 0; padding: 9px 12px; border-left: 0; }
      .footer .button { padding: 8px 10px; }
      .footer-middle { gap: 4px; }
      .footer-middle .button { font-size: 12px; }
      .review-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .color-panel { top: 59px; right: 15px; }
    }
    @media (max-width: 390px) {
      #progress { display: none; }
      .footer-middle .button { max-width: 106px; }
    }

    .wildcard-mode { --felt-light: #1b7054; --felt-mid: #0c4c3c; --felt-deep: #072f29; --felt-header: #0a4234; --felt-card: #125540; --felt-card-deep: #0a3e33; }
    body.wildcard-mode { background: var(--felt-header); }
    .wildcard-mode .shell { background: radial-gradient(circle at 30% 20%, var(--felt-light) 0, var(--felt-mid) 55%, var(--felt-deep) 100%) left bottom / 48% calc(100% - 70px) no-repeat var(--felt-header); }
    .wildcard-mode[data-wild-color="ruby"] { --felt-light: #963f50; --felt-mid: #682939; --felt-deep: #361824; --felt-header: #592130; --felt-card: #793247; --felt-card-deep: #4a1d2c; }
    .wildcard-mode[data-wild-color="sapphire"] { --felt-light: #3a77a8; --felt-mid: #23537d; --felt-deep: #112a48; --felt-header: #1b456d; --felt-card: #2c618e; --felt-card-deep: #173b62; }
    .wildcard-mode[data-wild-color="amethyst"] { --felt-light: #8059a2; --felt-mid: #5b3c7b; --felt-deep: #2e2042; --felt-header: #50346e; --felt-card: #674789; --felt-card-deep: #3d2a5c; }
    .wildcard-mode[data-wild-color="copper"] { --felt-light: #a87842; --felt-mid: #76502c; --felt-deep: #3d291c; --felt-header: #684329; --felt-card: #895b34; --felt-card-deep: #513521; }
    .wildcard-mode .topbar { background: var(--felt-header); color: #f9f2df; border-bottom: 2px solid #b89b5e; }
    .wildcard-mode .top-actions .button { background: #f9f2df; color: #123d30; border-color: #d3ba81; }
    .wildcard-mode .layout { position: relative; isolation: isolate; background: transparent; }
    .wildcard-mode .layout::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; clip-path: inset(0 0 0 48%); background: radial-gradient(circle at 70% 15%, var(--felt-light) 0, var(--felt-mid) 45%, var(--felt-deep) 100%); }
    .wildcard-mode .passage { color: #fff7e7; border-right-color: #bc9d60; background: transparent; }
    .wildcard-mode .author { color: #e6dbc0; }
    .wildcard-mode .visual-stage { border: 1px solid #c7a96b; background: #00000032; box-shadow: inset 0 0 0 1px #ffffff1a, 0 18px 40px #001c186b; }
    .wildcard-mode .question-pane, .wildcard-mode .question-pane.is-wrong { color: #fff8e9; border: 2px solid #c6a765; background: linear-gradient(155deg, var(--felt-card), var(--felt-card-deep)); box-shadow: 0 18px 45px #001c186b, inset 0 0 0 1px #ffffff1b; }
    .wildcard-mode .question-head { align-items: center; flex-wrap: wrap; padding-bottom: 17px; border-bottom: 1px solid #d6bc7b66; }
    .wildcard-mode .question-head h2 { display: flex; align-items: center; gap: 11px; }
    .wildcard-mode .question-head h2::before { content: "♠"; display: grid; place-items: center; width: 34px; height: 34px; border: 3px dashed #fff0c1; border-radius: 50%; background: #c5a45f; color: #133b30; font: 700 22px/1 Georgia, serif; }
    .wildcard-mode .flag input { accent-color: #d8ba74; }
    .wildcard-mode .choice { border-color: #dfd0ad; background: #fff9ec; color: #183a30; box-shadow: 0 2px 0 #072b2455; }
    .wildcard-mode .choice:hover:not(:disabled), .wildcard-mode .strike:hover:not(:disabled) { background: #fff0cf; }
    .wildcard-mode .choice[aria-pressed="true"] { border-color: #d7b366; background: #f7e3aa; box-shadow: 0 0 0 2px #e1c27b66; }
    .wildcard-mode .choice .letter { border-color: #8a3029; background: #ad3c34; color: #fff8ed; font-weight: 700; }
    .wildcard-mode .choice[aria-pressed="true"] .letter { border-color: #0c4939; background: #0c4939; color: #fff7e8; }
    .wildcard-mode .choice.is-eliminated .choice-text { color: #6b6e62; }
    .wildcard-mode .choice.is-wrong-choice { border-color: #af493b; background: #f4d7d0; color: #5e231e; }
    .wildcard-mode .strike { border-color: #d8c7a4; background: #fff9ec; color: #183a30; }
    .wildcard-mode .strike[aria-pressed="true"] { background: #e9d5a4; border-color: #c2a15d; }
    .wildcard-mode .utility, .wildcard-mode .confidence p { color: #dce8de; }
    .wildcard-mode .segments .button { border-color: #b49e6c; background: #fff8e9; color: #183a30; }
    .wildcard-mode .segments .button[aria-pressed="true"] { border-color: #e4ca88; background: #e5c875; color: #183a30; }
    .wildcard-mode .text-button { color: #f8e2a8; }
    .wildcard-mode .feedback { border-left-color: #d9ba72; }
    .wildcard-mode .feedback.is-wrong { border-left-color: #f0a69c; }
    .wildcard-mode .correct { color: #cdeab8; }
    .wildcard-mode .incorrect, .wildcard-mode .other-choices .your-choice-note { color: #ffc0b8; }
    .wildcard-mode .other-choices { border-top-color: #d6bc7b66; }
    .wildcard-mode .other-choices li.your-choice { background: #803f3977; }
    .wildcard-mode .footer { border-color: #bc9d60; background: var(--felt-header); }
    @media (min-width: 901px) {
      .wildcard-mode .footer { position: relative; margin-left: 0; padding-top: 12px; padding-left: calc(48% + 20px); border-top: 0; border-left: 0; background: linear-gradient(90deg, transparent 48%, var(--felt-header) 48%); }
      .wildcard-mode .footer::before { content: ""; position: absolute; left: calc(48% - 1px); top: 0; bottom: 0; width: 1px; background: #bc9d60; }
    }
    .wildcard-mode .footer .button { border-color: #c8ac74; background: #fff8e9; color: #153b30; }
    .wildcard-mode .footer .button.primary { border-color: #e2c47e; background: #d8b66b; color: #13392e; }
    .wildcard-mode #progress { color: #e0e9df; }
    .wildcard-mode .mobile-tabs { border-bottom-color: #bc9d60; background: var(--felt-header); }
    .wildcard-mode .mobile-tabs button { background: var(--felt-header); color: #fff5de; }
    .wildcard-mode .mobile-tabs button[aria-selected="true"] { border-bottom-color: #dbb86d; }
    @media (max-width: 900px) {
      .wildcard-mode .shell { background: var(--felt-header); }
      .wildcard-mode .layout::before { clip-path: none; }
      .wildcard-mode .passage { background: radial-gradient(circle at 30% 20%, var(--felt-light) 0, var(--felt-mid) 55%, var(--felt-deep) 100%); }
      .wildcard-mode .question-pane, .wildcard-mode .question-pane.is-wrong { margin: 0; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1 class="brand">@@TITLE@@</h1>
      </div>
      <div class="top-actions">
        <button id="new-attempt" class="button" type="button" aria-label="Start a new attempt" aria-expanded="false" aria-controls="attempt-panel">New</button>
        <button id="color-toggle" class="button" type="button" aria-expanded="false" aria-controls="color-panel">Colors</button>
      </div>
    </header>

    <section id="attempt-panel" class="color-panel attempt-panel" aria-label="New attempt" hidden>
      <p>Start fresh? This clears your current answers.</p>
      <div class="color-actions">
        <button id="cancel-attempt" class="button" type="button">Cancel</button>
        <button id="confirm-attempt" class="button primary" type="button">Start new</button>
      </div>
    </section>

    <section id="color-panel" class="color-panel" aria-label="Color settings" hidden>
      <h2>Colors</h2>
      <p>Choose a preset or pick your own background and text colors.</p>
      <div id="presets" class="presets"></div>
      <div class="color-controls">
        <label>Background <input id="background-color" type="color" value="#f8f7f2"></label>
        <label>Text <input id="text-color" type="color" value="#24342d"></label>
      </div>
      <div id="contrast" class="contrast" role="status"></div>
      <div class="color-actions">
        <button id="reset-colors" class="button subtle" type="button">Reset colors</button>
        <button id="close-colors" class="button" type="button">Done</button>
      </div>
    </section>

    <nav class="mobile-tabs" aria-label="Practice view">
      <button id="poem-tab" type="button" aria-selected="false">Poem</button>
      <button id="question-tab" type="button" aria-selected="true">Questions</button>
    </nav>

    <main class="layout">
      <section class="passage" aria-label="Poem or question visual">
        <div id="poem-content">
        <h2>@@TITLE@@</h2>
        <p class="author">@@AUTHOR@@</p>
        <div id="poem" class="verse"></div>
@@GLOSS_AND_SOURCE@@
        </div>
        <div id="wildcard-content" hidden>
          <div id="wildcard-visual" class="visual-stage"></div>
        </div>
      </section>
      <section id="panel" class="question-pane" aria-label="Questions"></section>
    </main>

    <footer class="footer">
      <button id="back" class="button" type="button">Back</button>
      <div class="footer-middle">
        <span id="progress"></span>
        <button id="review" class="button" type="button">Review answers</button>
      </div>
      <button id="next" class="button primary" type="button">Next</button>
    </footer>
  </div>

  <div id="wildcard-warning" class="wildcard-warning" role="alertdialog" aria-modal="true" aria-labelledby="wildcard-warning-title" hidden>
    <div class="wildcard-warning-card">
      <h2 id="wildcard-warning-title">The WildCard Questions Have Eliminated Your Points LOL</h2>
      <div class="wildcard-score-change" aria-label="Original poem score replaced by zero out of fifteen">
        <span id="wildcard-original-score" class="wildcard-original-score"></span>
        <span class="wildcard-score-arrow" aria-hidden="true">→</span>
        <span class="wildcard-final-score">0/15</span>
      </div>
      <button id="wildcard-warning-close" class="button primary" type="button">See results</button>
    </div>
  </div>

  <script>
    let bank = @@BANK_JSON@@;
    let distractorExplanations = @@DISTRACTORS_JSON@@;
    const bonusBank = @@BONUS_JSON@@;
    const sourceBank = bank;
    const sourceDistractors = distractorExplanations;
    const CORE_COUNT = 15;
    const MIN_BONUS_COUNT = 3;
    const MAX_BONUS_COUNT = 5;
    const WILD_COLORS = ["emerald", "ruby", "sapphire", "amethyst", "copper"];
    const WILD_CATEGORIES = ["capital city", "people faces", "math", "iGEM", "flags"];
    let TOTAL_COUNT = CORE_COUNT;
    const STORAGE_KEY = "@@STORAGE_KEY@@";
    const COLOR_KEY = "@@COLOR_KEY@@";
    const LETTERS = "ABCDE";
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    const presets = [
      { name: "Paper", background: "#f8f7f2", text: "#24342d" },
      { name: "Warm", background: "#fff1e5", text: "#402c24" },
      { name: "Sage", background: "#eaf2e9", text: "#243a2e" },
      { name: "Dusk", background: "#222d3a", text: "#f7f3e9" },
      { name: "Ink", background: "#191e28", text: "#eff0ea" }
    ];
    const defaultColors = { background: presets[0].background, text: presets[0].text };

    function shuffled(values) {
      const result = [...values];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }
    function validBonusOrder(values) {
      return Array.isArray(values) && values.length >= 2 && values.length <= MAX_BONUS_COUNT &&
        new Set(values).size === values.length &&
        values.every((value) => Number.isInteger(value) && value >= 0 && value < bonusBank.questions.length);
    }
    function validSlots(values, count) {
      return Array.isArray(values) && values.length === count &&
        new Set(values).size === count && values.every((value) => Number.isInteger(value) && value >= 1 && value < CORE_COUNT);
    }
    function validColors(values, count) {
      return Array.isArray(values) && values.length === count &&
        new Set(values).size === count && values.every((value) => WILD_COLORS.includes(value));
    }
    function applySequence(attempt) {
      const entries = [];
      let bonusPointer = 0;
      for (let core = 0; core < CORE_COUNT; core++) {
        entries.push({ kind: "core", sourceIndex: core });
        if (attempt.bonusAfter.includes(core + 1)) {
          entries.push({ kind: "bonus", sourceIndex: attempt.bonusOrder[bonusPointer], bonusOrdinal: bonusPointer });
          bonusPointer++;
        }
      }
      TOTAL_COUNT = entries.length;
      bank = {
        ...sourceBank,
        id: "@@PRACTICE_ID@@",
        questions: entries.map(({ kind, sourceIndex, bonusOrdinal }) => kind === "core"
          ? { ...sourceBank.questions[sourceIndex], kind }
          : { ...bonusBank.questions[sourceIndex], bonusOrdinal }),
        key: entries.map(({ kind, sourceIndex }) => kind === "core" ? sourceBank.key[sourceIndex] : bonusBank.key[sourceIndex]),
        explanations: entries.map(({ kind, sourceIndex }) => kind === "core" ? sourceBank.explanations[sourceIndex] : bonusBank.explanations[sourceIndex])
      };
      distractorExplanations = entries.map(({ kind, sourceIndex }) => kind === "core"
        ? sourceDistractors[sourceIndex] : bonusBank.distractors[sourceIndex]);
    }

    function newState(previous = null) {
      const count = MIN_BONUS_COUNT + Math.floor(Math.random() * (MAX_BONUS_COUNT - MIN_BONUS_COUNT + 1));
      const previousItems = new Set(previous?.bonusOrder || []);
      const seenItems = new Set(previous?.seenBonusIds || previous?.bonusOrder || []);
      const candidates = (category, tier, chosen) => {
        const eligible = bonusBank.questions.map((question, index) =>
          question.category === category && question.tier === tier &&
          !previousItems.has(index) && !chosen.includes(index) ? index : -1).filter((index) => index >= 0);
        return shuffled(eligible).sort((a, b) => Number(seenItems.has(a)) - Number(seenItems.has(b)));
      };
      let chosen;
      for (let retry = 0; retry < 300 && !chosen; retry++) {
        const categoryCount = 3 + Math.floor(Math.random() * (Math.min(count, WILD_CATEGORIES.length) - 2));
        const categories = shuffled(WILD_CATEGORIES).slice(0, categoryCount);
        const easyCategory = categories.includes("people faces") ? "people faces" : shuffled(categories)[0];
        const draft = [];
        for (const category of shuffled(categories)) {
          const option = candidates(category, category === easyCategory ? "easy" : "elite", draft)[0];
          if (option !== undefined) draft.push(option);
        }
        if (draft.length !== categories.length) continue;
        while (draft.length < count) {
          const eligible = shuffled(categories.flatMap((category) => candidates(category, "elite", draft)));
          if (!eligible.length) break;
          const fresh = eligible.filter((index) => !seenItems.has(index));
          draft.push((fresh.length ? fresh : eligible)[0]);
        }
        if (draft.length === count) chosen = draft;
      }
      if (!chosen) throw new Error("Wildcard pool is too small for a fresh attempt.");
      const bonusOrder = shuffled(chosen);
      const eligibleSlots = Array.from({ length: CORE_COUNT - 2 }, (_, index) => index + 2);
      const bonusAfter = shuffled(eligibleSlots).slice(0, count).sort((a, b) => a - b);
      if (previous && bonusAfter.join(",") === previous.bonusAfter?.join(",")) {
        bonusAfter[0] = eligibleSlots.find((slot) => !bonusAfter.includes(slot));
        bonusAfter.sort((a, b) => a - b);
      }
      const total = CORE_COUNT + count;
      return {
        answers: Array(total).fill(null),
        eliminated: Array.from({ length: total }, () => Array(5).fill(false)),
        flags: Array(total).fill(false),
        confidence: Array(total).fill(null),
        bonusAfter,
        bonusOrder,
        seenBonusIds: [...new Set([...seenItems, ...bonusOrder])],
        bonusColors: shuffled(WILD_COLORS).slice(0, count),
        scoringVersion: 3,
        warningSeen: false,
        index: 0,
        maxStepSeen: 0,
        view: "question",
        submitted: false,
        notes: ""
      };
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || !validBonusOrder(saved.bonusOrder) ||
            !validSlots(saved.bonusAfter, saved.bonusOrder.length) ||
            !Array.isArray(saved.answers) || saved.answers.length !== CORE_COUNT + saved.bonusOrder.length) return newState();
        const count = saved.bonusOrder.length;
        const total = CORE_COUNT + count;
        const state = { ...saved };
        state.seenBonusIds = Array.isArray(saved.seenBonusIds)
          ? saved.seenBonusIds.filter((index) => Number.isInteger(index) && index >= 0 && index < bonusBank.questions.length)
          : [...saved.bonusOrder];
        state.bonusColors = validColors(saved.bonusColors, count) ? saved.bonusColors : shuffled(WILD_COLORS).slice(0, count);
        state.answers = state.answers.map((answer) => LETTERS.includes(answer) ? answer : null);
        state.eliminated = Array.from({ length: total }, (_, i) =>
          Array.from({ length: 5 }, (_, k) => Boolean(saved.eliminated?.[i]?.[k]))
        );
        state.flags = Array.from({ length: total }, (_, i) => Boolean(saved.flags?.[i]));
        state.confidence = Array.from({ length: total }, (_, i) =>
          ["Low", "Medium", "High"].includes(saved.confidence?.[i]) ? saved.confidence[i] : null
        );
        state.maxStepSeen = Number.isInteger(saved.maxStepSeen) && saved.maxStepSeen >= 0 && saved.maxStepSeen < total ? saved.maxStepSeen : 0;
        state.index = Number.isInteger(saved.index) && saved.index >= 0 && saved.index <= state.maxStepSeen ? saved.index : 0;
        state.view = ["question", "review", "results"].includes(saved.view) ? saved.view : "question";
        state.submitted = Boolean(saved.submitted);
        state.warningSeen = Boolean(saved.warningSeen);
        if (!state.submitted && state.view === "results") state.view = "question";
        state.notes = typeof saved.notes === "string" ? saved.notes : "";
        return state;
      } catch {
        return newState();
      }
    }

    let state = loadState();
    applySequence(state);
    let storageAvailable = true;
    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch { storageAvailable = false; }
    }
    saveState();

    function startNewAttempt() {
      state = newState(state);
      applySequence(state);
      saveState();
      $("attempt-panel").hidden = true;
      $("new-attempt").setAttribute("aria-expanded", "false");
      render();
      $("panel").scrollTop = 0;
      mobileView(false);
    }
    $("new-attempt").addEventListener("click", () => {
      const panel = $("attempt-panel");
      panel.hidden = !panel.hidden;
      $("new-attempt").setAttribute("aria-expanded", String(!panel.hidden));
    });
    $("cancel-attempt").addEventListener("click", () => {
      $("attempt-panel").hidden = true;
      $("new-attempt").setAttribute("aria-expanded", "false");
    });
    $("confirm-attempt").addEventListener("click", startNewAttempt);

    function hexToRgb(hex) {
      return [1, 3, 5].map((offset) => parseInt(hex.slice(offset, offset + 2), 16));
    }
    function rgbToHex(rgb) {
      return "#" + rgb.map((value) => Math.round(value).toString(16).padStart(2, "0")).join("");
    }
    function blend(first, second, shareOfSecond) {
      const a = hexToRgb(first), b = hexToRgb(second);
      return rgbToHex(a.map((value, i) => value * (1 - shareOfSecond) + b[i] * shareOfSecond));
    }
    function luminance(hex) {
      const channels = hexToRgb(hex).map((value) => {
        const normalized = value / 255;
        return normalized <= 0.04045 ? normalized / 12.92 : ((normalized + 0.055) / 1.055) ** 2.4;
      });
      return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
    }
    function contrastRatio(first, second) {
      const values = [luminance(first), luminance(second)].sort((a, b) => b - a);
      return (values[0] + 0.05) / (values[1] + 0.05);
    }
    function validHex(value) { return /^#[0-9a-f]{6}$/i.test(value); }
    function loadColors() {
      try {
        const saved = JSON.parse(localStorage.getItem(COLOR_KEY));
        if (validHex(saved?.background) && validHex(saved?.text)) return saved;
      } catch { /* Storage can be unavailable for local files in some browsers. */ }
      return { ...defaultColors };
    }

    let colors = loadColors();
    function applyColors() {
      const root = document.documentElement.style;
      root.setProperty("--page-bg", colors.background);
      root.setProperty("--page-text", colors.text);
      root.setProperty("--surface", blend(colors.background, colors.text, 0.025));
      root.setProperty("--soft", blend(colors.background, colors.text, 0.085));
      root.setProperty("--hover", blend(colors.background, colors.text, 0.11));
      root.setProperty("--border", blend(colors.background, colors.text, 0.25));
      root.setProperty("--muted", blend(colors.background, colors.text, 0.68));
      root.setProperty("--accent", colors.text);
      root.setProperty("--accent-text", colors.background);
      root.setProperty("--success", blend(colors.text, colors.background, 0.12));
      const darkBackground = luminance(colors.background) < 0.35;
      const wrongColor = darkBackground ? "#ffb4a8" : "#a82929";
      root.setProperty("--error", wrongColor);
      root.setProperty("--wrong-border", wrongColor);
      root.setProperty("--wrong-tint", blend(colors.background, "#cf4747", darkBackground ? 0.20 : 0.12));
      root.setProperty("--wrong-choice-bg", blend(colors.background, "#cf4747", darkBackground ? 0.27 : 0.18));
      $("background-color").value = colors.background;
      $("text-color").value = colors.text;
      const ratio = contrastRatio(colors.background, colors.text);
      $("contrast").textContent = ratio < 4.5
        ? `Low contrast (${ratio.toFixed(1)}:1). Try colors with a stronger difference for easier reading.`
        : `Text contrast: ${ratio.toFixed(1)}:1`;
      $("contrast").classList.toggle("warning", ratio < 4.5);
      document.querySelectorAll("[data-preset]").forEach((button) => {
        const preset = presets[Number(button.dataset.preset)];
        button.setAttribute("aria-pressed", String(preset.background === colors.background && preset.text === colors.text));
      });
      try { localStorage.setItem(COLOR_KEY, JSON.stringify(colors)); } catch { /* Still works for this session. */ }
    }

    $("presets").innerHTML = presets.map((preset, index) => `
      <button class="preset" type="button" data-preset="${index}" aria-pressed="false">
        <span class="swatch" style="background:${preset.background}"></span>${preset.name}
      </button>
    `).join("");
    document.querySelectorAll("[data-preset]").forEach((button) => {
      button.addEventListener("click", () => {
        const preset = presets[Number(button.dataset.preset)];
        colors = { background: preset.background, text: preset.text };
        applyColors();
      });
    });
    $("background-color").addEventListener("input", (event) => {
      colors.background = event.target.value;
      applyColors();
    });
    $("text-color").addEventListener("input", (event) => {
      colors.text = event.target.value;
      applyColors();
    });
    $("reset-colors").addEventListener("click", () => {
      colors = { ...defaultColors };
      applyColors();
    });
    function showColors(visible) {
      $("color-panel").hidden = !visible;
      $("color-toggle").setAttribute("aria-expanded", String(visible));
      if (visible) $("background-color").focus();
      else $("color-toggle").focus();
    }
    $("color-toggle").addEventListener("click", () => showColors($("color-panel").hidden));
    $("close-colors").addEventListener("click", () => showColors(false));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !$("color-panel").hidden) showColors(false);
    });
    applyColors();

    $("poem").innerHTML = bank.lines.map((line, index) => `
      <div class="line ${line.stanzaStart ? "stanza" : ""}">
        <span class="line-number">${index + 1}</span><span class="line-text">${escapeHtml(line.text)}</span>
      </div>
    `).join("");

    function mobileView(poemVisible) {
      document.body.classList.toggle("show-poem", poemVisible);
      $("poem-tab").setAttribute("aria-selected", String(poemVisible));
      $("question-tab").setAttribute("aria-selected", String(!poemVisible));
    }
    $("poem-tab").addEventListener("click", () => mobileView(true));
    $("question-tab").addEventListener("click", () => mobileView(false));

    function goToQuestion(index) {
      if (index < 0 || index >= TOTAL_COUNT || (!state.submitted && index > state.maxStepSeen + 1)) return;
      state.index = index;
      state.maxStepSeen = Math.max(state.maxStepSeen, index);
      state.view = "question";
      saveState();
      render();
      $("panel").scrollTop = 0;
      mobileView(false);
    }
    function rawPoemScore() {
      return state.answers.reduce((count, answer, index) => count + Number(bank.questions[index].kind === "core" && answer === bank.key[index]), 0);
    }
    function score() {
      return pointsEliminated() || (state.scoringVersion === 2 && bonusScore() === 0) ? 0 : rawPoemScore();
    }
    function bonusScore() {
      return state.answers.reduce((count, answer, index) => count + Number(bank.questions[index].kind === "bonus" && answer === bank.key[index]), 0);
    }
    function wildcardMisses() {
      return state.answers.reduce((count, answer, index) => count + Number(bank.questions[index].kind === "bonus" && answer !== bank.key[index]), 0);
    }
    function pointsEliminated() {
      return state.scoringVersion === 3 && wildcardMisses() >= 2;
    }
    function totalScore() {
      return pointsEliminated() ? 0 : score() + bonusScore();
    }
    function showWildcardWarning() {
      $("wildcard-original-score").textContent = `${rawPoemScore()}/15`;
      $("wildcard-warning").previousElementSibling.inert = true;
      $("wildcard-warning").hidden = false;
      $("wildcard-warning-close").focus();
    }
    function renderPassage(question) {
      const bonus = question.kind === "bonus";
      document.body.classList.toggle("wildcard-mode", bonus);
      if (bonus) document.body.dataset.wildColor = state.bonusColors[question.bonusOrdinal];
      else delete document.body.dataset.wildColor;
      $("poem-content").hidden = bonus;
      $("wildcard-content").hidden = !bonus;
      $("poem-tab").textContent = bonus ? "Visual" : "Poem";
      if (bonus) {
        $("wildcard-visual").innerHTML = question.visual;
      }
    }
    function updateNavigation() {
      $("progress").textContent = `${bank.questions.filter((question, index) => question.kind === "core" && state.answers[index]).length} of 15 answered`;
      $("back").disabled = state.view === "question" && state.index === 0;
      $("back").textContent = state.view === "question" ? "Back" : "Questions";
      $("next").textContent = state.view === "question"
        ? (state.index === TOTAL_COUNT - 1 ? (state.submitted ? "Results" : "Review") : "Next")
        : (state.submitted ? "Review explanations" : "Return to question");
      $("review").textContent = state.submitted ? "Results" : "Review answers";
    }

    function renderQuestion() {
      const index = state.index;
      const question = bank.questions[index];
      renderPassage(question);
      const answer = state.answers[index];
      const options = question.options.map((option, optionIndex) => {
        const letter = LETTERS[optionIndex];
        const eliminated = state.eliminated[index][optionIndex];
        return `
          <div class="option-row">
            <button class="choice ${eliminated ? "is-eliminated" : ""} ${state.submitted && answer === letter && answer !== bank.key[index] ? "is-wrong-choice" : ""}" type="button"
              data-choice="${letter}" aria-pressed="${answer === letter}" ${state.submitted ? "disabled" : ""}>
              <span class="letter">${letter}</span><span class="choice-text">${escapeHtml(option)}</span>
            </button>
            ${state.submitted ? "" : `<button class="strike" type="button" data-eliminate="${letter}"
              aria-label="${eliminated ? "Restore" : "Cross out"} option ${letter}"
              title="${eliminated ? "Restore" : "Cross out"} option ${letter}"
              aria-pressed="${eliminated}">×</button>`}
          </div>
        `;
      }).join("");
      const confidence = state.submitted ? "" : `
        <div class="confidence">
          <p>Confidence</p>
          <div class="segments" role="group" aria-label="Confidence for ${question.kind === "bonus" ? "wildcard question" : `question ${question.n}`}">
            ${["Low", "Medium", "High"].map((level) => `
              <button class="button" type="button" data-confidence="${level}"
                aria-pressed="${state.confidence[index] === level}">${level}</button>
            `).join("")}
          </div>
        </div>
      `;
      const otherChoices = state.submitted ? `
        <details class="other-choices" ${answer && answer !== bank.key[index] ? "open" : ""}>
          <summary>${/\bEXCEPT\b/.test(question.stem)
            ? "Why the other choices are supported"
            : "Why the other choices are wrong"}</summary>
          <ul>
            ${[...LETTERS].filter((letter) => letter !== bank.key[index]).map((letter) => `
              <li class="${answer === letter ? "your-choice" : ""}">
                <span class="letter-label">${letter}.</span>
                ${escapeHtml(distractorExplanations[index][letter])}
                ${answer === letter ? '<span class="your-choice-note"> Your choice</span>' : ""}
              </li>
            `).join("")}
          </ul>
        </details>
      ` : "";
      const feedback = state.submitted ? `
        <div class="feedback ${answer && answer !== bank.key[index] ? "is-wrong" : ""}">
          <strong class="${answer === bank.key[index] ? "correct" : "incorrect"}">
            ${answer === bank.key[index] ? "✓ Correct" : answer ? "✗ Incorrect" : "Unanswered"}
            · ${answer ? `You chose ${answer}` : "No answer selected"}
            · Correct answer: ${bank.key[index]}
          </strong>
          <p class="answer-explanation">${escapeHtml(bank.explanations[index])}</p>
          ${otherChoices}
        </div>
      ` : `
        <div class="utility">
          ${storageAvailable ? "" : '<span>Storage unavailable. Keep this page open.</span>'}
          <button id="clear-answer" class="text-button" type="button">Clear answer</button>
        </div>
      `;

      $("panel").innerHTML = `
        <div class="question-head">
          <h2>${question.kind === "bonus" ? "Wildcard" : `Question ${question.n} of 15`}</h2>
          <label class="flag"><input id="flag" type="checkbox" ${state.flags[index] ? "checked" : ""}>Mark for review</label>
        </div>
        ${question.kind === "bonus" ? '<button id="show-visual" class="button visual-open" type="button">View picture or equation</button>' : ""}
        <p class="stem">${escapeHtml(question.stem)}</p>
        <div class="options">${options}</div>
        ${confidence}${feedback}
      `;

      $("flag").addEventListener("change", (event) => {
        state.flags[index] = event.target.checked;
        saveState();
      });
      $("show-visual")?.addEventListener("click", () => mobileView(true));
      $("panel").querySelectorAll("[data-choice]").forEach((button) => {
        button.addEventListener("click", () => {
          const letter = button.dataset.choice;
          state.answers[index] = letter;
          state.eliminated[index][LETTERS.indexOf(letter)] = false;
          saveState();
          render();
          $("panel").querySelector(`[data-choice="${letter}"]`).focus();
        });
      });
      $("panel").querySelectorAll("[data-eliminate]").forEach((button) => {
        button.addEventListener("click", () => {
          const letter = button.dataset.eliminate;
          const position = LETTERS.indexOf(letter);
          state.eliminated[index][position] = !state.eliminated[index][position];
          if (state.eliminated[index][position] && state.answers[index] === letter) state.answers[index] = null;
          saveState();
          render();
          $("panel").querySelector(`[data-eliminate="${letter}"]`).focus();
        });
      });
      $("panel").querySelectorAll("[data-confidence]").forEach((button) => {
        button.addEventListener("click", () => {
          const level = button.dataset.confidence;
          state.confidence[index] = state.confidence[index] === level ? null : level;
          saveState();
          render();
          $("panel").querySelector(`[data-confidence="${level}"]`).focus();
        });
      });
      $("clear-answer")?.addEventListener("click", () => {
        state.answers[index] = null;
        saveState();
        render();
      });
    }

    function reviewGrid(showResults) {
      return `<div class="review-grid">${bank.questions.map((question, index) => {
        if (!showResults && index > state.maxStepSeen) return "";
        const answer = state.answers[index];
        const label = showResults
          ? (answer === bank.key[index] ? "Correct" : answer ? "Incorrect" : "Unanswered")
          : (answer ? `Answer ${answer}` : "Unanswered");
        return `
          <button class="button review-cell ${answer ? "answered" : ""} ${showResults && answer && answer !== bank.key[index] ? "is-wrong" : ""} ${state.flags[index] ? "flagged" : ""}"
            type="button" data-go="${index}">
            <b>${question.kind === "bonus" ? "★" : question.n}</b><small>${question.kind === "bonus" ? "Bonus · " : ""}${label}${state.flags[index] ? " · Flagged" : ""}</small>
          </button>
        `;
      }).join("")}</div>`;
    }
    function bindReviewGrid() {
      $("panel").querySelectorAll("[data-go]").forEach((button) => {
        button.addEventListener("click", () => goToQuestion(Number(button.dataset.go)));
      });
    }

    function renderReview() {
      renderPassage({ kind: "core" });
      const unanswered = bank.questions.filter((question, index) => question.kind === "core" && !state.answers[index]).length;
      const flags = state.flags.slice(0, state.maxStepSeen + 1).filter(Boolean).length;
      const reachedEnd = state.maxStepSeen === TOTAL_COUNT - 1;
      $("panel").innerHTML = `
        <h2>Review your answers</h2>
        <p class="review-intro">${unanswered} unanswered · ${flags} flagged</p>
        ${reviewGrid(false)}
        <label class="notes-label" for="notes">Unfamiliar words <small>(optional)</small></label>
        <textarea id="notes">${escapeHtml(state.notes)}</textarea>
        <div class="actions">
          ${reachedEnd ? '<button id="submit" class="button primary" type="button">Submit</button>' : ""}
          <button id="keep-working" class="button" type="button">Keep working</button>
        </div>
        <p class="review-note">${reachedEnd ? "Submission locks this attempt." : "Finish the remaining questions to submit."}</p>
      `;
      bindReviewGrid();
      $("notes").addEventListener("input", (event) => { state.notes = event.target.value; saveState(); });
      $("keep-working").addEventListener("click", () => goToQuestion(state.index));
      $("submit")?.addEventListener("click", () => {
        state.submitted = true;
        state.view = "results";
        const showWarning = pointsEliminated() && !state.warningSeen;
        if (showWarning) state.warningSeen = true;
        saveState();
        render();
        $("panel").scrollTop = 0;
        if (showWarning) showWildcardWarning();
      });
    }

    function summary() {
      return [
        @@TITLE_JSON@@,
        `Score: ${score()}/15`,
        `Bonus: +${bonusScore()}/${state.bonusOrder.length}`,
        `Total: ${totalScore()}`,
        "",
        ...bank.questions.map((question, index) =>
          `${question.kind === "bonus" ? `Wildcard (${question.topic})` : `Question ${question.n}`}: ${state.answers[index] || "Unanswered"} | confidence: ${state.confidence[index] || "not recorded"} | flagged: ${state.flags[index] ? "yes" : "no"}`
        ),
        "",
        ...(state.notes ? [`Unfamiliar words: ${state.notes}`] : [])
      ].join("\n");
    }

    function renderResults() {
      renderPassage({ kind: "core" });
      $("panel").innerHTML = `
        <h2>Practice complete</h2>
        <div class="score">${score()} / 15 <span>${Math.round(score() / 15 * 100)}%</span></div>
        ${state.scoringVersion === 2 && bonusScore() === 0 ? '<p class="result-info">All wildcards missed: poem score 0.</p>' : ''}
        <p class="result-info">Bonus: <strong>+${bonusScore()} / ${state.bonusOrder.length}</strong> · Total: <strong>${totalScore()} points</strong></p>
        <div class="actions">
          <button id="explanations" class="button primary" type="button">Review explanations</button>
          <button id="copy-results" class="button" type="button">Copy results</button>
          <button id="download-results" class="button" type="button">Download answers</button>
        </div>
        <p id="copy-status" class="status" role="status"></p>
        <details><summary>View answer summary</summary><textarea id="result-summary" readonly>${escapeHtml(summary())}</textarea></details>
        ${reviewGrid(true)}
        <button id="restart" class="text-button" type="button">Start a new attempt</button>
      `;
      bindReviewGrid();
      $("explanations").addEventListener("click", () => {
        const firstMiss = state.answers.findIndex((answer, index) => answer !== bank.key[index]);
        goToQuestion(firstMiss < 0 ? 0 : firstMiss);
      });
      $("copy-results").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(summary());
          $("copy-status").textContent = "Copied.";
        } catch {
          const field = $("result-summary");
          field.parentElement.open = true;
          field.focus();
          field.select();
          $("copy-status").textContent = "Select and copy the answer summary below.";
        }
      });
      $("download-results").addEventListener("click", () => {
        const blob = new Blob([summary()], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = "@@DOWNLOAD_NAME@@";
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      $("restart").addEventListener("click", () => {
        const box = document.createElement("div");
        box.className = "actions";
        box.innerHTML = `
          <p class="review-note">This clears the current attempt.</p>
          <button id="confirm-restart" class="button primary" type="button">Clear attempt and start again</button>
          <button id="cancel-restart" class="button" type="button">Keep this attempt</button>
        `;
        $("restart").replaceWith(box);
        $("confirm-restart").addEventListener("click", () => {
          startNewAttempt();
        });
        $("cancel-restart").addEventListener("click", renderResults);
      });
    }

    function render() {
      updateNavigation();
      $("panel").classList.toggle(
        "is-wrong",
        state.view === "question" && state.submitted && Boolean(state.answers[state.index]) &&
          state.answers[state.index] !== bank.key[state.index]
      );
      if (state.view === "review") renderReview();
      else if (state.view === "results") renderResults();
      else renderQuestion();
    }

    $("back").addEventListener("click", () => goToQuestion(Math.max(0, state.index - (state.view === "question" ? 1 : 0))));
    $("next").addEventListener("click", () => {
      if (state.view === "question") {
        if (state.index < TOTAL_COUNT - 1) goToQuestion(state.index + 1);
        else {
          state.view = state.submitted ? "results" : "review";
          saveState();
          render();
          $("panel").scrollTop = 0;
        }
      } else if (state.submitted) goToQuestion(0);
      else goToQuestion(state.index);
    });
    $("review").addEventListener("click", () => {
      state.view = state.submitted ? "results" : "review";
      saveState();
      render();
      $("panel").scrollTop = 0;
      mobileView(false);
    });
    $("wildcard-warning-close").addEventListener("click", () => {
      $("wildcard-warning").hidden = true;
      $("wildcard-warning").previousElementSibling.inert = false;
      $("explanations").focus();
    });
    render();
  </script>
</body>
</html>
