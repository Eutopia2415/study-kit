<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@PAGE_TITLE@@</title>
<style>
:root{--ink:#112d50;--muted:#667485;--border:#c9d1dc;--accent:#193e65;--pale:#edf3f9;--paper:#fff;--success:#1b654c;--error:#a73535}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px Georgia,"Times New Roman",serif}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:#fff;border:1px solid #9baabd;border-radius:5px;padding:11px 20px;min-height:44px}button:hover{background:#f1f5f9}button:disabled{cursor:default;opacity:.45}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.primary:hover{background:#102f50}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d29928;outline-offset:3px}
header{min-height:76px;border-bottom:1px solid var(--border);padding:12px 38px;display:flex;align-items:center;gap:22px}h1{font-size:29px;margin:0;letter-spacing:-.4px}header .meta{margin-left:auto;font-size:15px}#clock{font-variant-numeric:tabular-nums;font-size:20px;border-left:1px solid var(--border);padding-left:24px;min-width:82px}#clock.expired{color:var(--error)}header button{font:600 15px system-ui,sans-serif}
main{display:grid;grid-template-columns:47% 53%;height:calc(100dvh - 154px)}.passage{padding:30px 35px 30px 40px;overflow:auto;border-right:1px solid var(--border)}h2{font-size:29px;margin:0 0 4px} .author{font-size:21px;margin:0 0 22px}.verse{font-size:18px;line-height:1.58}.line{display:grid;grid-template-columns:28px 1fr;gap:14px}.line.stanza{margin-top:23px}.ln{color:#798391;font:13px/2.19 Georgia,serif;text-align:right;user-select:none}.words{white-space:pre-wrap}.source{font:13px/1.6 system-ui,sans-serif;color:var(--muted);margin-top:27px}.source a{color:var(--ink)}.gloss{font-size:15px;line-height:1.6;border-top:1px solid var(--border);padding-top:18px;margin-top:25px}.gloss p{margin:3px 0}
.question-pane{padding:31px 40px 38px;overflow:auto}.q-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}.q-head h2{font-size:25px}.flag-label{display:flex;align-items:center;gap:9px;font-size:15px;white-space:nowrap}.flag-label input{width:19px;height:19px;accent-color:var(--accent)}.stem{font-size:21px;line-height:1.5;margin:0 0 30px}.options{display:grid;gap:13px}.option{display:flex;align-items:center;text-align:left;gap:20px;width:100%;min-height:72px;padding:15px 18px;border:1px solid var(--border);border-radius:7px;font-size:19px;line-height:1.4}.letter{display:grid;place-items:center;flex:0 0 37px;height:37px;border:1px solid #8293a7;border-radius:50%;font-size:19px}.option[aria-checked=true]{background:var(--pale);border:2px solid var(--accent);padding:14px 17px}.option[aria-checked=true] .letter{background:var(--accent);color:#fff;border-color:var(--accent)}.option.eliminated{color:#89929c}.option.eliminated .option-text{text-decoration:line-through}.confidence{margin-top:32px}.confidence p{margin:0 0 12px;font-size:16px}.segments{display:flex;gap:12px}.segments button{flex:1;font-size:16px;min-height:44px}.segments button[aria-pressed=true]{background:var(--pale);border:2px solid var(--accent);padding:10px 19px}.utility{display:flex;justify-content:space-between;gap:12px;margin-top:22px;align-items:center;font:13px system-ui,sans-serif;color:var(--muted)}.textbutton{border:0;text-decoration:underline;padding:5px;min-height:32px;background:none;font-size:13px}.feedback{margin-top:25px;border-left:3px solid var(--accent);padding:5px 0 5px 18px;line-height:1.6;font-size:17px}.feedback strong{display:block;margin-bottom:7px}.correct{color:var(--success)}.incorrect{color:var(--error)}
footer{height:78px;border-top:1px solid var(--border);padding:15px 38px;display:flex;align-items:center;justify-content:space-between;gap:20px}.foot-mid{display:flex;gap:16px;align-items:center}.foot-mid span{font:13px system-ui,sans-serif;color:var(--muted)}footer button{min-width:125px}.review-intro{color:var(--muted);font-size:16px;line-height:1.5}.review-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:25px 0}.review-cell{padding:13px 8px;min-height:84px;position:relative}.review-cell b{display:block;font-size:22px}.review-cell small{display:block;font:12px system-ui,sans-serif;margin-top:6px;color:var(--muted)}.review-cell.answered{background:var(--pale)}.review-cell.flagged{border-top:4px solid #ae7919;padding-top:10px}.review-cell .mark{color:#996610}.review-note{font:14px system-ui,sans-serif;line-height:1.6;color:var(--muted)}textarea{display:block;width:100%;min-height:85px;border:1px solid var(--border);padding:13px;border-radius:5px;margin:10px 0 20px;font:15px/1.5 system-ui,sans-serif;resize:vertical}.notes-label{font-size:16px}.review-actions{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.score{font-size:48px;letter-spacing:-1px;margin:23px 0 10px}.score span{font-size:20px;color:var(--muted);letter-spacing:0}.result-info{font-size:16px;line-height:1.6}.status{font:13px system-ui,sans-serif;color:var(--muted);margin-top:12px;min-height:20px}.mobile-tabs{display:none}.instructions{border-bottom:1px solid var(--border);padding-bottom:17px;margin-bottom:21px;font:14px/1.6 system-ui,sans-serif;color:var(--muted)}#result-summary{min-height:200px}.timer-message{font:14px/1.5 system-ui,sans-serif;color:var(--muted);margin-top:12px}
@media(min-width:1400px){header{padding-left:48px;padding-right:48px}.passage{padding-left:48px}.question-pane{padding-left:38px;padding-right:48px}.verse{font-size:19px}.stem{font-size:23px}.option{font-size:21px;min-height:76px}}
@media(max-width:900px){header{padding:12px 20px;gap:14px}h1{font-size:23px}header .meta{display:none}#clock{margin-left:auto;padding-left:10px}.passage{padding:25px 22px}.question-pane{padding:25px 24px}.verse{font-size:16px}.line{gap:8px;grid-template-columns:20px 1fr}.stem{font-size:19px}.option{font-size:17px;gap:13px}.q-head{align-items:flex-start}.q-head h2{font-size:22px}.flag-label{font-size:13px}.foot-mid span{display:none}}
@media(max-width:900px){header{min-height:68px;padding:10px 15px;gap:9px}h1{font-size:19px;max-width:min(52vw,440px)}header button{font-size:12px;padding:8px 10px;min-height:38px}#clock{font-size:17px;min-width:62px}.mobile-tabs{display:flex;height:46px;border-bottom:1px solid var(--border)}.mobile-tabs button{flex:1;border:0;border-radius:0;font:15px system-ui,sans-serif;min-height:44px}.mobile-tabs button[aria-selected=true]{border-bottom:3px solid var(--accent);font-weight:650}main{display:block;height:calc(100dvh - 190px)}.passage,.question-pane{height:100%;border-right:0;padding:25px 20px}.passage{display:none}body.show-poem .passage{display:block}body.show-poem .question-pane{display:none}.verse{font-size:17px}.line{grid-template-columns:22px 1fr;gap:10px}.stem{font-size:20px}.q-head{margin-bottom:25px}.q-head h2{font-size:22px}.option{font-size:18px;min-height:66px;padding:12px}.option[aria-checked=true]{padding:11px}.letter{flex-basis:32px;height:32px}.confidence{margin-top:25px}.review-grid{grid-template-columns:repeat(3,minmax(0,1fr))}footer{height:76px;padding:13px 15px;gap:8px}footer button{min-width:0;font-size:14px;padding:10px 13px}.foot-mid{gap:0}.author{font-size:19px}h2{font-size:27px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><h1>@@TITLE@@</h1><div id="clock" aria-label="Time remaining">@@CLOCK@@</div><button id="timer-button" class="primary">Start timer</button></header>
<nav class="mobile-tabs" aria-label="Practice view"><button id="poem-tab" aria-selected="false">Poem</button><button id="question-tab" aria-selected="true">Questions</button></nav>
<main><section class="passage" aria-label="Poem"><h2>@@TITLE@@</h2><p class="author">@@AUTHOR@@</p><div class="verse" id="poem"></div>@@SOURCE_HTML@@</section>
<section class="question-pane" id="panel" aria-label="Questions"></section></main>
<footer><button id="back">Back</button><div class="foot-mid"><span id="progress"></span><button id="review">Review answers</button></div><button id="next" class="primary">Next</button></footer>
<script>
const bank=@@BANK_JSON@@;
const questions=bank.questions, answerKey=bank.key, explanations=bank.explanations, poemLines=bank.lines;
const total=questions.length, limit=bank.minutes*60;
const STORE=bank.storage_id;
const fresh=()=>({answers:Array(total).fill(null),flags:Array(total).fill(false),confidence:Array(total).fill(null),index:0,view:'question',seconds:limit,deadline:null,submitted:false,notes:'',elapsed:0,startedAt:null});
let state=fresh(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&Array.isArray(saved.answers)&&saved.answers.length===total&&saved.answers.every(a=>a===null||'ABCDE'.includes(a))&&Array.isArray(saved.flags)&&saved.flags.length===total&&Array.isArray(saved.confidence)&&saved.confidence.length===total&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<total&&['question','review','results'].includes(saved.view)&&Number.isFinite(saved.seconds)&&saved.seconds>=0&&saved.seconds<=limit)state=Object.assign(fresh(),saved)}catch(e){storageOK=false}
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){storageOK=false}}
function timerUpdate(){if(state.deadline&&!state.submitted){state.seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if(!state.seconds){state.deadline=null;save();render()}}el('clock').textContent=String(Math.floor(state.seconds/60)).padStart(2,'0')+':'+String(state.seconds%60).padStart(2,'0');el('clock').classList.toggle('expired',state.seconds===0);el('timer-button').textContent=state.submitted?'Finished':state.deadline?'Pause timer':state.seconds===0?'Time elapsed':state.seconds===limit?'Start timer':'Resume timer';el('timer-button').disabled=state.submitted||state.seconds===0}
el('timer-button').onclick=()=>{if(state.deadline){timerUpdate();state.deadline=null}else{state.deadline=Date.now()+state.seconds*1000;if(!state.startedAt)state.startedAt=Date.now()}save();timerUpdate()};
el('poem').innerHTML=poemLines.map((line,i)=>'<div class="line '+(line.stanzaStart?'stanza':'')+'"><span class="ln">'+(i+1)+'</span><span class="words">'+esc(line.text)+'</span></div>').join('');
function mobileView(poem){document.body.classList.toggle('show-poem',poem);el('poem-tab').setAttribute('aria-selected',poem);el('question-tab').setAttribute('aria-selected',!poem)}
el('poem-tab').onclick=()=>mobileView(true);el('question-tab').onclick=()=>mobileView(false);
function go(n){state.index=n;state.view='question';save();render();el('panel').scrollTop=0;mobileView(false)}
function score(){return state.answers.reduce((total,a,i)=>total+(a===answerKey[i]?1:0),0)}
function nav(){el('progress').textContent=state.answers.filter(Boolean).length+' of '+total+' answered';el('back').disabled=state.view==='question'&&state.index===0;el('back').textContent=state.view==='question'?'Back':'Questions';el('next').textContent=state.view==='question'?(state.index===total-1?(state.submitted?'Results':'Review answers'):'Next'):(state.submitted?'Review explanations':'Return to question');el('review').textContent=state.submitted?'Results':'Review answers';}
function render(){
nav();timerUpdate();const panel=el('panel');
if(state.view==='review'){renderReview();return}if(state.view==='results'){renderResults();return}
const q=questions[state.index],a=state.answers[state.index],i=state.index;
panel.innerHTML='<div class="q-head"><h2 id="question-title">Question '+q.n+' of '+total+'</h2><label class="flag-label"><input id="flag" type="checkbox" '+(state.flags[i]?'checked':'')+'>Mark for review</label></div><p class="stem" id="stem">'+esc(q.stem)+'</p><div class="options" role="radiogroup" aria-labelledby="stem">'+q.options.map((text,k)=>{const l=String.fromCharCode(65+k);return '<button class="option" role="radio" aria-checked="'+(a===l)+'" data-choice="'+l+'" '+(state.submitted?'disabled':'')+'><span class="letter">'+l+'</span><span class="option-text">'+esc(text)+'</span></button>'}).join('')+'</div>'+
(!state.submitted?'<div class="confidence"><p>Confidence (optional)</p><div class="segments">'+['Low','Medium','High'].map(c=>'<button data-confidence="'+c+'" aria-pressed="'+(state.confidence[i]===c)+'">'+c+'</button>').join('')+'</div></div><div class="utility"><span>'+(!storageOK?'Browser storage unavailable; keep this page open.':'Progress saved in this browser')+'</span><button class="textbutton" id="clear">Clear answer</button></div>':'<div class="feedback"><strong class="'+(a===answerKey[i]?'correct':'incorrect')+'">'+(a===answerKey[i]?'Correct':a?'Your answer: '+a:'Unanswered')+' · Answer: '+answerKey[i]+'</strong>'+esc(explanations[i])+'</div>')+
(state.seconds===0&&!state.submitted?'<p class="timer-message" role="status">The suggested '+bank.minutes+' minutes have elapsed. Your answers are safe. You can finish or review at your own pace.</p>':'');
el('flag').onchange=e=>{state.flags[i]=e.target.checked;save()};
panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=b.dataset.choice;save();render();el('panel').querySelector('[data-choice="'+state.answers[i]+'"]').focus({preventScroll:true})});
panel.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{state.confidence[i]=state.confidence[i]===b.dataset.confidence?null:b.dataset.confidence;save();render();el('panel').querySelector('[data-confidence="'+b.dataset.confidence+'"]').focus({preventScroll:true})});
if(el('clear'))el('clear').onclick=()=>{state.answers[i]=null;save();render()};
}
function grid(results){return '<div class="review-grid">'+questions.map((q,i)=>'<button class="review-cell '+(state.answers[i]?'answered ':'')+(state.flags[i]?'flagged':'')+'" data-go="'+i+'"><b>'+q.n+'</b><small>'+(results?(state.answers[i]===answerKey[i]?'Correct':state.answers[i]?'Review':'Unanswered'):(state.answers[i]?'Answer '+state.answers[i]:'Unanswered'))+(state.flags[i]?' · Flagged':'')+'</small></button>').join('')+'</div>'}
function bindGrid(){el('panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)))}
function renderReview(){
const unanswered=total-state.answers.filter(Boolean).length,flags=state.flags.filter(Boolean).length;
el('panel').innerHTML='<h2>Review your answers</h2><p class="review-intro">'+unanswered+' unanswered · '+flags+' marked for review. Select a question to return to it.</p>'+grid(false)+'<p class="review-note">A gold top border marks questions you flagged. You can change any answer before submitting.</p><label class="notes-label" for="notes">Any words you did not know? <span class="review-note">(optional)</span></label><textarea id="notes" placeholder="Keep unfamiliar vocabulary separate from interpretation mistakes.">'+esc(state.notes)+'</textarea><div class="review-actions"><button id="submit" class="primary">Submit '+(unanswered?'with '+unanswered+' unanswered':'answers')+'</button><button id="return">Keep working</button></div><p class="review-note">Submission locks this attempt and shows your score. Explanations stay closed until you choose to review them.</p>';
bindGrid();el('notes').oninput=e=>{state.notes=e.target.value;save()};el('return').onclick=()=>go(state.index);
el('submit').onclick=()=>{timerUpdate();state.deadline=null;state.submitted=true;state.elapsed=limit-state.seconds;state.view='results';save();render();el('panel').scrollTop=0};
}
function summary(){return 'AP Literature Practice — '+bank.title+'\nSet: '+bank.id+'\nRevision: '+bank.revision+'\nScore: '+score()+'/'+total+' ('+Math.round(score()/total*100)+'%)\nTimed minutes used: '+(state.elapsed/60).toFixed(1)+' (timer optional)\n\n'+questions.map((q,i)=>q.n+': '+(state.answers[i]||'Unanswered')+' | confidence: '+(state.confidence[i]||'not recorded')+' | flagged: '+(state.flags[i]?'yes':'no')).join('\n')+'\n\nUnfamiliar words: '+(state.notes||'none recorded')+'\n\nPlease diagnose my answers, separating vocabulary gaps from interpretation errors.'}
function renderResults(){
el('panel').innerHTML='<h2>Practice complete</h2><div class="score">'+score()+' / '+total+' <span>'+Math.round(score()/total*100)+'%</span></div><p class="result-info">This is your score for this practice set, not a predicted AP exam score. Your first-attempt answers are saved.</p><div class="review-actions"><button id="explain" class="primary">Review explanations</button><button id="copy">Copy results for tutor</button><button id="download">Download answers</button></div><p id="copy-status" class="status" role="status">Bring your answers back to our conversation for a closer diagnosis.</p><details><summary>View answer summary</summary><textarea id="result-summary" readonly>'+esc(summary())+'</textarea></details>'+grid(true)+'<button class="textbutton" id="restart">Start a new attempt</button>';
bindGrid();el('explain').onclick=()=>go(Math.max(0,state.answers.findIndex((a,i)=>a!==answerKey[i])));
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());el('copy-status').textContent='Copied. Paste the results into our conversation.'}catch(e){const d=el('result-summary');d.parentElement.open=true;d.focus();d.select();el('copy-status').textContent='Select and copy the answer summary below.'}};
el('download').onclick=()=>{const blob=new Blob([summary()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=bank.id+'-answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('restart').onclick=()=>{const box=document.createElement('div');box.className='review-actions';box.innerHTML='<p class="review-note">Starting again clears this attempt. Download your answers first if you want to keep them.</p><button id="confirm-restart" class="primary">Clear attempt and start again</button><button id="cancel-restart">Keep this attempt</button>';el('restart').replaceWith(box);el('confirm-restart').onclick=()=>{state=fresh();save();render();el('panel').scrollTop=0};el('cancel-restart').onclick=()=>renderResults();box.scrollIntoView({block:'nearest'});};
}
el('back').onclick=()=>go(state.view==='question'?Math.max(0,state.index-1):state.index);
el('next').onclick=()=>{if(state.view==='question'){if(state.index<total-1)go(state.index+1);else{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0}}else if(state.submitted){go(0)}else go(state.index)};
el('review').onclick=()=>{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0;mobileView(false)};
setInterval(timerUpdate,1000);render();
</script></body></html>
